name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - .dockerignore
      - .github/workflows/image.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - src/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=milk-parlor
          cache-to: type=gha,mode=max,scope=milk-parlor
          provenance: mode=max
          sbom: true
      - name: Copy main image to Cloudflare Registry
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: d8a5175f959d3dbd4084db9fcab1c44c
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA}"
          docker pull --platform linux/amd64 "$image"
          docker tag "$image" milk-parlor:main
          npx --yes wrangler@4.126.0 containers push milk-parlor:main

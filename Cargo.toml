[package]
name = "milk-parlor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Small OpenAI-compatible gateway for Milk"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
bytes = "1.10"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v7"] }
zstd = "0.13"
